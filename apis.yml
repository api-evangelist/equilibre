aid: equilibre
name: EquiLibre
description: 'EquiLibre Technologies is a Prague-based frontier AI trading research lab building
  self-learning reinforcement-learning agents that trade equities autonomously across the S&P 500
  and Nasdaq. Founded by ex-DeepMind researchers Martin Schmid, Matej Moravcik, and Rudolf Kadlec —
  the trio behind the DeepStack poker AI — the company applies the same game-solving and continual-learning
  techniques to financial markets, with its agents trading billions of dollars daily in partnership with
  quantitative firm Tower Research Capital. In 2026 EquiLibre raised a Series A led by Creandum at a
  reported ~EUR 438M / $500M+ valuation. It operates as a proprietary trading and research lab and does
  not currently publish a public developer API, SDKs, or developer documentation; this profile tracks the
  company in the API Evangelist network.'
